*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);font-family:var(--body);color:#eaf4ff;touch-action:none;overscroll-behavior:none}
#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font-family:inherit}
#fxFlash{position:fixed;inset:0;pointer-events:none;z-index:6;background:#fff;opacity:0}
/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10;font-family:var(--disp)}
.pill{position:absolute;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;background:var(--panel);border:var(--stroke);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.3);font-size:clamp(15px,4.2vmin,22px);color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.4);white-space:nowrap}
.coinIc{width:1.1em;height:1.1em;border-radius:50%;background:var(--coin,radial-gradient(circle at 35% 35%,#fff3b0,#ffcf3a 55%,#d68a00));background-size:cover;box-shadow:0 2px 6px rgba(0,0,0,.4);flex:none}
.ballIc{width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cfd8e6 60%,#8494ac);box-shadow:0 2px 5px rgba(0,0,0,.4);flex:none}
/* the hole pill is centred in the band BETWEEN the coin box and the button cluster, not in the
   viewport — viewport-centring put it under the mute/settings buttons on every phone width. */
#holeBox{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 12px);
  left:calc(env(safe-area-inset-left,0px) + var(--sal) + 100px);
  right:calc(env(safe-area-inset-right,0px) + var(--sar) + 124px);
  transform:none;margin:0 auto;width:max-content;max-width:100%;
  padding:7px 14px;font-size:clamp(10px,3.1vw,15px);white-space:nowrap;overflow:hidden}
#dots{position:absolute;top:calc(env(safe-area-inset-top,0px) + var(--sat) + 58px);left:50%;transform:translateX(-50%);display:flex;gap:6px}
#dots .dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.25)}
#dots .dot.done{background:var(--gr);border-color:transparent;box-shadow:0 0 6px rgba(47,224,138,.7)}
#dots .dot.cur{background:#fff;border-color:transparent;transform:scale(1.25);box-shadow:0 0 8px rgba(255,255,255,.8)}
#coinBox{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 12px);left:calc(env(safe-area-inset-left,0px) + var(--sal) + 12px)}
#coinBox.bump{animation:bump .28s ease}
#strokeBox{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 62px);left:calc(env(safe-area-inset-left,0px) + var(--sal) + 12px)}
#strokeBox.warn{color:var(--or)}
#strokeBox.last{color:var(--rd);animation:pulse .8s ease-in-out infinite}
#windChip{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 112px);left:calc(env(safe-area-inset-left,0px) + var(--sal) + 12px);color:var(--cy);font-size:clamp(12px,3.4vmin,17px);padding:6px 12px 6px 8px}
#windArrow{width:1.25em;height:1.25em;fill:currentColor;transition:transform .2s;flex:none}
#callout{position:absolute;top:24%;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.co{font-size:clamp(26px,8vmin,54px);letter-spacing:1px;color:#fff;text-shadow:0 4px 0 rgba(10,20,40,.9),0 0 18px rgba(0,0,0,.4);animation:coIn 1.05s cubic-bezier(.2,.9,.3,1.1) forwards;white-space:nowrap}
.co.cy{color:var(--cy)}.co.or{color:var(--or)}.co.mg{color:var(--mg)}.co.gold{color:var(--gold)}.co.gr{color:var(--gr)}.co.rd{color:var(--rd)}
.co.small{font-size:clamp(18px,5vmin,30px)}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + var(--sab) + 76px);left:50%;transform:translateX(-50%);max-width:88vw;background:rgba(8,14,26,.7);border:var(--stroke);border-radius:12px;padding:9px 16px;font-family:var(--body);font-weight:700;font-size:clamp(12px,3.4vmin,16px);color:#dbeafe;text-align:center;transition:opacity .6s}
#hint.fade{opacity:0}
/* power meter (during aim drag) */
#powerBox{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + var(--sab) + 26px);left:50%;transform:translateX(-50%);width:min(52vw,240px);height:12px;border-radius:8px;background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.18);overflow:hidden;opacity:0;transition:opacity .15s}
#powerBox.on{opacity:1}
#powerFill{height:100%;width:100%;border-radius:6px;background:linear-gradient(90deg,#2fe08a,#ffd75e 55%,#ff5a5a);transform:scaleX(0);transform-origin:left}
#cupArrow{position:fixed;z-index:12;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:var(--panel);border:var(--stroke);display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#cupArrow svg{width:20px;height:20px;fill:var(--gr);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
#cupArrow .caFlag{font-size:14px;line-height:1;margin-top:-2px}
/* ---------- top buttons ---------- */
#topBtns{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--sat) + 10px);right:calc(env(safe-area-inset-right,0px) + var(--sar) + 10px);display:flex;gap:8px;z-index:30}
.ib{width:48px;height:48px;border-radius:50%;border:var(--stroke);background:var(--panel);color:#e6f2ff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 6px 16px rgba(0,0,0,.3);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);pointer-events:auto}
.ib:active{transform:scale(.94)}
.ib svg{width:22px;height:22px;fill:currentColor}
.pauseIc{width:14px;height:16px;background:linear-gradient(90deg,#fff 0 35%,transparent 35% 65%,#fff 65%)}
/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(env(safe-area-inset-top,0px) + var(--sat) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + var(--sab) + 16px);gap:14px;background:radial-gradient(900px 600px at 50% 0%,rgba(47,224,138,.10),transparent 60%),linear-gradient(180deg,rgba(6,10,20,.45),rgba(6,10,20,.82));opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s,visibility 0s linear .3s}
.overlay.show{opacity:1;visibility:visible;pointer-events:auto;transition:opacity .3s,visibility 0s}
.overlay:not(.show) *{pointer-events:none!important}
.overlay.soft{background:linear-gradient(180deg,rgba(6,10,20,.28),transparent 40%,transparent 70%,rgba(6,10,20,.28));pointer-events:none}
.overlay.soft.show{pointer-events:none}
.overlay h2{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(28px,8.4vmin,52px);color:#fff;letter-spacing:1px;text-shadow:0 4px 0 #14202e,0 10px 24px rgba(0,0,0,.4)}
#oos h2{color:var(--rd);text-shadow:0 4px 0 #3a0d0d,0 10px 24px rgba(0,0,0,.4)}
#results h2{color:var(--gold)}
.titleWrap{display:flex;flex-direction:column;align-items:center;margin-bottom:6px}
#title{margin:0;font-family:var(--disp);font-weight:400;font-size:clamp(56px,17vmin,118px);line-height:.92;color:#fff;letter-spacing:2px;transform:rotate(-3deg);text-shadow:0 5px 0 #14202e,0 10px 0 rgba(0,0,0,.35),-5px 0 0 rgba(53,224,255,.45),5px 0 0 rgba(47,224,138,.45);animation:float 4s ease-in-out infinite}
#title span{display:block;font-size:.82em;background:linear-gradient(90deg,#7dfab5,#12c46e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 0 #063d22);text-shadow:none}
.tag{margin-top:10px;font-family:var(--body);font-weight:800;font-size:clamp(11px,3.2vmin,15px);letter-spacing:4px;color:rgba(53,224,255,.9)}
.menuBtns{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:8px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.col{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:6px}
.btn{pointer-events:auto;font-family:var(--disp);font-weight:400;font-size:clamp(16px,4.4vmin,22px);letter-spacing:1px;color:#3a2400;background:linear-gradient(#ffd75e,#ff9f1a);border:none;border-bottom:5px solid #b96b00;border-radius:14px;padding:12px 28px;cursor:pointer;transition:transform .12s,filter .12s;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 10px 24px rgba(0,0,0,.35);min-width:150px}
.btn.big{font-size:clamp(20px,6vmin,28px);padding:15px 44px;min-width:220px}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.ghost{background:rgba(255,255,255,.08);color:#eaf4ff;border:2px solid rgba(255,255,255,.22);border-bottom-width:4px;font-size:clamp(14px,3.8vmin,18px);padding:10px 22px}
.btn.ghost:active{border-bottom-width:2px}
.btn.reward{background:linear-gradient(#5ff0a8,#12c46e);border-bottom-color:#0a7a44;color:#03200f}
.btn.reward::before{content:'▶';font-size:.8em;margin-right:8px;opacity:.85}
.btn.reward.busy{opacity:.55;pointer-events:none}
.btn[disabled]{opacity:.5;pointer-events:none}
.best{font-family:var(--disp);font-size:clamp(13px,3.6vmin,17px);letter-spacing:2px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5)}
.best.mara{color:var(--cy);font-size:clamp(11px,3.1vmin,15px)}
.hintLine{font-size:clamp(11px,3.2vmin,14px);color:rgba(220,234,255,.7);letter-spacing:1px;font-weight:600}
.card{background:var(--panel);border:var(--stroke);border-radius:16px;padding:14px 20px;max-width:min(88vw,440px);font-size:clamp(13px,3.6vmin,16px);font-weight:700;color:#e6f0ff;line-height:1.45;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);box-shadow:0 10px 28px rgba(0,0,0,.35)}
.lvlBig{font-family:var(--disp);font-size:clamp(40px,14vmin,92px);color:#fff;text-shadow:0 5px 0 #14202e,0 0 30px rgba(47,224,138,.5);animation:pop .6s cubic-bezier(.2,.9,.3,1.2)}
.bannerCourse{font-family:var(--disp);font-size:clamp(15px,4.4vmin,23px);color:var(--gr);letter-spacing:3px;text-shadow:0 2px 0 rgba(0,0,0,.55)}
.bannerPar{font-family:var(--disp);font-size:clamp(16px,4.8vmin,26px);color:var(--cy);letter-spacing:3px;margin-top:-8px;text-shadow:0 2px 0 rgba(0,0,0,.55)}
/* ---------- first-run coach: a hand that shows the drag, no words ---------- */
#coach{position:absolute;pointer-events:none;z-index:11;left:0;top:0;transform:translate(-50%,-50%)}
#coachHand{width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#fff,#cfe0f0 60%,#8fa6bd);
  box-shadow:0 4px 14px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.25);
  animation:coachDrag 2.6s ease-in-out infinite}
#coachTrail{position:absolute;left:-3px;top:0;width:6px;height:96px;border-radius:3px;transform-origin:top center;
  background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0));animation:coachFade 2.6s ease-in-out infinite}
#coachLbl{position:absolute;left:50%;top:112px;transform:translateX(-50%);white-space:nowrap;
  font-family:var(--body);font-weight:800;font-size:13px;letter-spacing:1px;color:#eaf4ff;text-shadow:0 2px 6px rgba(0,0,0,.8)}
@keyframes coachDrag{0%{transform:translateY(0) scale(1)}12%{transform:translateY(0) scale(.88)}
  55%{transform:translateY(92px) scale(.88)}68%{transform:translateY(92px) scale(1.15);opacity:1}
  76%{opacity:0}100%{transform:translateY(0) scale(1);opacity:0}}
@keyframes coachFade{0%,10%{opacity:0;height:0}55%{opacity:.8;height:92px}70%{opacity:0;height:92px}100%{opacity:0;height:0}}
/* ---------- settings ---------- */
#setList{display:flex;flex-direction:column;gap:8px;width:min(88vw,340px);pointer-events:auto}
.setRow{background:var(--panel);border:var(--stroke);border-radius:12px;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.setRow .lbl{font-family:var(--disp);font-size:clamp(12px,3.4vmin,15px);letter-spacing:1px;color:#fff}
.setSeg{display:flex;gap:4px}
.setSeg button{font-family:var(--disp);font-size:11px;letter-spacing:1px;color:#9fb4c8;background:rgba(255,255,255,.07);
  border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:5px 12px;cursor:pointer}
.setSeg button.on{color:#03222c;background:linear-gradient(#9af1ff,#35e0ff);border-color:transparent}
.setRow.danger .lbl{color:var(--rd)}
/* ---------- daily / missions ---------- */
.dailyBtn{background:linear-gradient(#7af6ff,#22b8d6);border-bottom-color:#0d7690;color:#032833;position:relative;
  font-size:clamp(14px,3.8vmin,18px);padding:10px 26px;min-width:0}
.dot2{position:absolute;top:-4px;right:-4px;width:13px;height:13px;border-radius:50%;background:var(--rd);
  border:2px solid #0b1020;animation:pulse 1.1s ease-in-out infinite}
.streakStrip{display:flex;gap:5px;align-items:center;justify-content:center;flex-wrap:wrap}
.streakStrip .sd{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font:800 10px/1 var(--body);color:#9fb4c8}
.streakStrip .sd.on{background:linear-gradient(#ffd75e,#ff9f1a);color:#3a2400;border-color:transparent}
.streakStrip .sd.today{box-shadow:0 0 0 2px var(--cy)}
.streakStrip .slbl{font-family:var(--disp);font-size:12px;letter-spacing:1px;color:var(--gold);margin-right:4px}
.dailyCard{display:flex;flex-direction:column;gap:5px;align-items:center;min-width:min(80vw,320px)}
.dailyCard .dpar{font-family:var(--disp);font-size:clamp(15px,4.2vmin,20px);color:#fff;letter-spacing:1px}
.dailyCard .dsub{font-size:12px;font-weight:700;color:#9fb4c8}
.dailyCard .dbest{font-family:var(--disp);font-size:clamp(13px,3.6vmin,17px);color:var(--gold)}
#missionList{display:flex;flex-direction:column;gap:6px;width:min(88vw,360px);pointer-events:auto}
.mRow{background:var(--panel);border:var(--stroke);border-radius:11px;padding:7px 11px;display:flex;flex-direction:column;gap:4px}
.mRow.done{border-color:rgba(47,224,138,.6)}
.mTop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.mTop .t{font-size:12px;font-weight:800;color:#e6f0ff;text-align:left}
.mTop .n{font-family:var(--disp);font-size:12px;color:var(--cy);font-variant-numeric:tabular-nums}
.mRow.done .mTop .n{color:var(--gr)}
.mBar{height:6px;border-radius:4px;background:rgba(0,0,0,.4);overflow:hidden}
.mBar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#35e0ff,#9af1ff)}
.mRow.done .mBar i{background:linear-gradient(90deg,#2fe08a,#7dfab5)}
.deMedal{font-size:clamp(44px,13vmin,72px);line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
/* ---------- progression block ---------- */
#prog{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:2px;min-width:min(74vw,300px)}
.progTop{display:flex;align-items:center;gap:9px}
.lvPill{font-family:var(--disp);font-size:clamp(12px,3.4vmin,16px);letter-spacing:1px;color:#04212c;
  background:linear-gradient(#9af1ff,#35e0ff);border-radius:999px;padding:3px 12px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.lvPill.up{animation:starPop .5s cubic-bezier(.2,.9,.3,1.4)}
.rankName{font-family:var(--disp);font-size:clamp(11px,3.1vmin,14px);letter-spacing:2px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.5)}
#xpBar{width:min(74vw,300px);height:9px;border-radius:6px;background:rgba(0,0,0,.42);border:2px solid rgba(255,255,255,.16);overflow:hidden}
#xpFill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#35e0ff,#9af1ff);transition:width .5s ease-out;box-shadow:0 0 10px rgba(53,224,255,.55)}
/* ---------- hole select ---------- */
#holeGrid{display:grid;grid-template-columns:repeat(3,minmax(84px,110px));gap:9px;pointer-events:auto}
body.landscape #holeGrid{grid-template-columns:repeat(5,minmax(84px,110px))}
.hcard{background:var(--panel);border:var(--stroke);border-radius:13px;padding:8px 4px 7px;display:flex;flex-direction:column;
  align-items:center;gap:3px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.hcard:active{transform:scale(.95)}
.hcard.done{border-color:rgba(47,224,138,.5)}
.hcard.locked{opacity:.45}
.hcard .hnum{font-family:var(--disp);font-size:clamp(15px,4.4vmin,21px);color:#fff;line-height:1}
.hcard .hpar{font-size:10px;font-weight:800;letter-spacing:1px;color:#9fb4c8}
.hcard .hstars{display:flex;gap:2px;height:12px}
.hcard .hs{width:11px;height:11px;background:radial-gradient(circle at 40% 35%,#fff6c2,#ffd75e 50%,#e09a12);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.18;filter:grayscale(1)}
.hcard .hs.on{opacity:1;filter:none}
.hcard .hbest{font-size:10px;font-weight:800;color:var(--gr);font-variant-numeric:tabular-nums;min-height:12px}
.hcard .hlock{font-size:15px;line-height:1.1}
.miniStar{width:1em;height:1em;background:radial-gradient(circle at 40% 35%,#fff6c2,#ffd75e 50%,#e09a12);
  clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);flex:none}
/* ---------- stats ---------- */
#statGrid{display:grid;grid-template-columns:repeat(2,minmax(130px,190px));gap:7px;pointer-events:auto;max-height:56vh;overflow-y:auto;padding:3px}
body.landscape #statGrid{grid-template-columns:repeat(4,minmax(130px,180px))}
.stRow{background:var(--panel);border:var(--stroke);border-radius:11px;padding:7px 11px;display:flex;flex-direction:column;gap:1px}
.stRow .k{font-size:10px;font-weight:800;letter-spacing:1px;color:#9fb4c8;text-transform:uppercase}
.stRow .v{font-family:var(--disp);font-size:clamp(15px,4.2vmin,20px);color:#fff;font-variant-numeric:tabular-nums}
.stRow.hi .v{color:var(--gold)}
/* ---------- course select ---------- */
#courseGrid{display:grid;grid-template-columns:repeat(2,minmax(140px,190px));gap:12px;pointer-events:auto}
body.landscape #courseGrid{grid-template-columns:repeat(4,minmax(148px,208px));max-height:68vh}
.ccard{background:var(--panel);border:var(--stroke);border-radius:16px;padding:12px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative;overflow:hidden;min-height:clamp(104px,14vh,124px);justify-content:center}
/* overflow:hidden zeroes a grid item's automatic minimum size, so without an explicit min-height
   the 14-course grid squashes every row and clips the names instead of scrolling. */
.ccard::before{content:'';position:absolute;inset:0 0 auto 0;height:6px;background:var(--cc,linear-gradient(90deg,#ff9d6c,#ffd75e))}
.ccard:active{transform:scale(.96)}
.ccard.locked{opacity:.6}
.ccard .cnum{font-family:var(--disp);font-size:11px;letter-spacing:2px;color:rgba(220,234,255,.6);margin-top:4px}
.ccard .cname{font-family:var(--disp);font-size:clamp(11px,2.9vmin,14px);letter-spacing:0.5px;color:#fff;line-height:1.1;
  min-height:2.2em;display:flex;align-items:center;text-align:center;padding:0 2px}
.ccard .cstars{font-family:var(--disp);font-size:12px;color:var(--gold);display:flex;align-items:center;gap:4px}
.ccard .cstars .mini{width:13px;height:13px;background:radial-gradient(circle at 40% 35%,#fff6c2,#ffd75e 50%,#e09a12);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.ccard .clock{font-size:20px;margin:2px 0}
.ccard .cdone{position:absolute;top:8px;right:8px;background:var(--gr);color:#04331b;font-family:var(--disp);font-size:10px;padding:2px 7px;border-radius:999px;letter-spacing:1px}
.ccard.mastered{border-color:rgba(255,215,94,.75);box-shadow:0 0 16px rgba(255,215,94,.3)}
.ccard.mastered .cdone{background:linear-gradient(#ffe89a,#f0b429);color:#4a3200}
.ccard.mastered::before{background:linear-gradient(90deg,#ffd75e,#ff9f1a)!important}
#courseGrid{max-height:58vh;overflow-y:auto;padding:4px}
/* ---------- shop ---------- */
.shopTop{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:center}
#shopCoins,#holesStars{position:static}
#statGrid{max-height:52vh}
.tabs{display:flex;gap:8px;pointer-events:auto}
.tabs{flex-wrap:wrap;justify-content:center}
.tab{font-family:var(--disp);font-size:clamp(11px,3.1vmin,14px);letter-spacing:1px;color:#9fb4c8;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.14);border-radius:999px;padding:7px 15px;cursor:pointer}
.tab.on{color:#03222c;background:linear-gradient(#9af1ff,#35e0ff);border-color:transparent}
#shopGrid{display:grid;grid-template-columns:repeat(3,minmax(86px,118px));gap:10px;pointer-events:auto;max-height:46vh;overflow-y:auto;padding:4px}
body.landscape #shopGrid{grid-template-columns:repeat(4,minmax(86px,118px));max-height:52vh}
.scard{background:var(--panel);border:var(--stroke);border-radius:14px;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;transition:transform .12s,border-color .12s;position:relative}
.scard:active{transform:scale(.96)}
.scard.sel{border-color:var(--gr);box-shadow:0 0 18px rgba(47,224,138,.45)}
.scard canvas{width:56px;height:56px;display:block;border-radius:50%;box-shadow:0 5px 12px rgba(0,0,0,.45)}
.scard .sname{font-family:var(--disp);font-size:11px;letter-spacing:1px;color:#fff;text-transform:uppercase}
.scard .scost{font-size:12px;font-weight:800;color:var(--gold);display:flex;align-items:center;gap:4px;min-height:16px}
.scard .scost .coinIc{width:12px;height:12px}
.scard.locked .sname{color:#9fb4c8}
.scard .stag{position:absolute;top:-8px;right:-6px;background:var(--gr);color:#04331b;font-family:var(--disp);font-size:10px;padding:2px 7px;border-radius:999px;letter-spacing:1px}
.scard.r1{border-color:rgba(120,200,255,.4)}
.scard.r2{border-color:rgba(53,224,255,.55)}
.scard.r3{border-color:rgba(201,107,255,.65);box-shadow:0 0 14px rgba(201,107,255,.25)}
.scard.r4{border-color:rgba(255,215,94,.8);box-shadow:0 0 18px rgba(255,215,94,.35)}
.scard .newB{position:absolute;top:-8px;left:-6px;background:var(--mg);color:#fff;font-family:var(--disp);font-size:9px;padding:2px 7px;border-radius:999px;letter-spacing:1px;animation:pulse 1.1s ease-in-out infinite}
.scard .scost.starReq{color:var(--cy)}
.scard .scost.canUnlock{color:#04331b;background:linear-gradient(#7dfab5,#12c46e);padding:2px 10px;border-radius:999px;font-family:var(--disp);font-size:11px;letter-spacing:1px}
.scard.pop{animation:cardPop .5s cubic-bezier(.2,.9,.3,1.4)}
@keyframes cardPop{0%{transform:scale(.82)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.ccard .cbest{font-size:11px;font-weight:800;color:#9fd7b9;font-variant-numeric:tabular-nums}
/* ---------- scorecard / results ---------- */
#scorecard{display:flex;flex-direction:column;gap:3px;background:var(--panel);border:var(--stroke);border-radius:14px;padding:10px 14px;pointer-events:auto;font-variant-numeric:tabular-nums}
.scRow{display:flex;gap:8px;font-family:var(--disp);font-size:clamp(11px,3vmin,14px);letter-spacing:1px;color:#cfe3f5;align-items:center}
.scRow span{width:clamp(17px,4.6vmin,24px);text-align:center}
.scRow .lab{width:58px;text-align:left;color:#9fb4c8;font-size:.85em}
.scRow.strokes span.under{color:var(--gr)}
.scRow.strokes span.over{color:var(--or)}
.scRow.head span{color:rgba(220,234,255,.5)}
.scRow span.skip{color:rgba(180,200,220,.28)}
.scRow .tot{width:34px;color:var(--gold)}
.scoreBig{font-family:var(--disp);font-size:clamp(30px,9vmin,56px);color:#fff;text-shadow:0 4px 0 #14202e;font-variant-numeric:tabular-nums}
#resLines,#maraLines{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:clamp(13px,3.6vmin,16px);color:#cfe3f5;margin-top:-6px}
#resLines b,#maraLines b{color:var(--gold)}
.newBest{font-family:var(--disp);padding:6px 18px;border-radius:999px;background:linear-gradient(90deg,#ffd75e,#ff8a1f);color:#3a1a00;font-size:clamp(13px,3.8vmin,18px);letter-spacing:2px;animation:pulse .8s ease-in-out infinite}
.star{width:clamp(44px,12vmin,64px);height:clamp(44px,12vmin,64px);background:radial-gradient(circle at 40% 35%,#fff6c2,#ffd75e 50%,#e09a12);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);opacity:.22;filter:grayscale(1);transform:scale(.8)}
.star.on{opacity:1;filter:none;animation:starPop .5s cubic-bezier(.2,.9,.3,1.4) forwards}
/* toast, ad mock, nogl */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + var(--sab) + 110px);transform:translateX(-50%) translateY(20px);z-index:40;background:rgba(8,14,26,.86);border:var(--stroke);border-radius:12px;padding:10px 18px;font-weight:700;font-size:14px;color:#fff;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.adCard{display:flex;flex-direction:column;gap:14px;align-items:center}
#adMockText{font-family:var(--disp);font-size:22px;letter-spacing:2px;color:var(--cy)}
#adMockSub{font-size:13px;font-weight:700;color:rgba(220,234,255,.75);max-width:260px;line-height:1.4}
#adMockBar{width:220px;height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden}
#adMockFill{height:100%;width:0;background:linear-gradient(90deg,var(--cy),#7af6ff);transition:width .1s linear}
#adMock{z-index:50;background:rgba(0,0,0,.82)}
#nogl{z-index:60;background:#0b1020}
#settings{background:linear-gradient(180deg,rgba(6,10,20,.94),rgba(6,10,20,.98))}
/* ---------- loading screen: painted by the static HTML, so the very first frame is a real loading screen ---------- */
#loading{z-index:55;background:#0b1020;gap:18px}
#loading .spin{width:44px;height:44px;border-radius:50%;border:4px solid rgba(255,255,255,.15);border-top-color:var(--gr);animation:spin .9s linear infinite}
#loadingLbl{font-family:var(--disp);font-size:clamp(14px,4vmin,20px);letter-spacing:4px;color:rgba(220,234,255,.85)}
@keyframes spin{to{transform:rotate(360deg)}}
#kbHint{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + var(--sab) + 46px);left:50%;transform:translateX(-50%);font-family:var(--body);font-weight:800;font-size:12px;letter-spacing:1px;color:rgba(220,234,255,.85);text-shadow:0 2px 6px rgba(0,0,0,.8);white-space:nowrap}
/* ---------- rewarded moments: opt-in buttons that never cover the ball or the HUD pills ---------- */
#btnUndo,#btnLine{position:absolute;right:calc(env(safe-area-inset-right,0px) + var(--sar) + 12px);min-width:0;padding:10px 16px;font-size:clamp(13px,3.6vmin,16px);z-index:12}
/* stacked in the free right-hand column under the gear/pause icons: never over the ball, the coach hand or the hint */
#btnLine{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 68px)}
#btnUndo{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 124px)}
#btnGift{position:fixed;top:calc(env(safe-area-inset-top,0px) + var(--sat) + 10px);left:calc(env(safe-area-inset-left,0px) + var(--sal) + 10px);z-index:30;min-width:0;padding:10px 16px;font-size:clamp(13px,3.6vmin,16px)}
.mDouble{align-self:flex-end;min-height:44px;min-width:96px;padding:6px 14px;border-radius:999px;border:none;border-bottom:3px solid #0a7a44;background:linear-gradient(#5ff0a8,#12c46e);color:#03200f;font-family:var(--disp);font-size:12px;letter-spacing:1px;cursor:pointer;pointer-events:auto}
.mDouble::before{content:'\25B6';font-size:.8em;margin-right:6px;opacity:.85}
/* landscape tweaks */
body.landscape #banner{gap:8px}
body.landscape #results{flex-direction:row;flex-wrap:wrap;gap:12px 28px;align-content:center}
body.landscape #results h2,body.landscape #resCourse{width:100%;margin:0}
/* ---------- animations ---------- */
@keyframes float{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-10px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes coIn{0%{opacity:0;transform:scale(.5) translateY(10px)}18%{opacity:1;transform:scale(1.14)}30%{transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.02) translateY(-18px)}}
@keyframes starPop{0%{transform:scale(.3) rotate(-30deg)}70%{transform:scale(1.2) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@media (max-height:520px){#title{font-size:clamp(42px,12vmin,84px)}.overlay{gap:8px}.btn.big{padding:11px 34px}#shopGrid{max-height:56vh}}

/* ---------- YouTube design guidelines: 48 dp targets, no clipped overlays at any aspect ratio (9:32 … 32:9) ---------- */
.btn{min-height:48px}
.btn.ghost{min-height:44px}
.tab{min-height:44px;padding:9px 16px}
.setSeg button{min-height:44px;min-width:60px;font-size:12px}
.overlay{overflow-y:auto}                /* safety net only: the rules below are meant to make it never scroll */
.overlay::-webkit-scrollbar{width:0;height:0}
/* wide and short (21:9 / 32:9 desktop windows, phones held sideways): lay the menu out in rows */
@media (max-height:560px) and (min-aspect-ratio:7/4){
  #menu{flex-direction:row;flex-wrap:wrap;gap:6px 26px;align-content:center;justify-content:center}
  #menu .titleWrap{margin:0}
  #title{font-size:clamp(34px,15vmin,64px);transform:rotate(-2deg)}
  #menu .tag{display:none}
  #menu .menuBtns{gap:8px;margin:0}
  #menu #prog,#menu #menuStars,#menu #menuBest,#menu #menuHint{width:100%;margin:0}
  #menu #menuHint{display:none}
  .overlay{gap:8px}
  .overlay h2{font-size:clamp(20px,7vmin,34px)}
  .btn.big{padding:10px 28px;min-width:170px;font-size:clamp(16px,5vmin,22px)}
  .col{flex-direction:row;flex-wrap:wrap;justify-content:center}
  #courseGrid,#shopGrid,#holeGrid,#statGrid{max-height:60vh}
  #scorecard{padding:6px 10px}
  #daily{flex-direction:row;flex-wrap:wrap;gap:8px 24px;align-content:center}
  #daily h2,#daily .streakStrip{width:100%}
  #missionList{width:min(46vw,360px)}
}
/* very short viewports (32:9 at 450 px): smaller title, tighter cards */
@media (max-height:470px){
  #title{font-size:clamp(30px,13vmin,52px)}
  .lvlBig{font-size:clamp(32px,12vmin,64px)}
  .btn{padding:9px 22px}
  #setList{gap:5px}.setRow{padding:6px 10px}
  .ccard{min-height:88px;padding:8px 8px}
}
/* extra-tall phones (9:21, 9:32): keep the HUD near the thumbs, not stretched */
@media (min-aspect-ratio:1/2.2) and (max-aspect-ratio:1/1.9) and (min-height:900px){
  #powerBox{bottom:calc(env(safe-area-inset-bottom,0px) + var(--sab) + 60px)}
  #hint{bottom:calc(env(safe-area-inset-bottom,0px) + var(--sab) + 110px)}
}
/* contrast: small caption text must clear 4.5:1 on the panel */
.ccard .cnum{color:rgba(220,234,255,.82)}
.hintLine{color:rgba(220,234,255,.82)}

/* narrow phones: the button cluster shrinks so the hole pill keeps its band.
   Must stay at the END of the sheet — .ib is defined later than #holeBox and would win. */
@media (max-width:430px){
  .ib{width:44px;height:44px}
  #topBtns{gap:6px}
  #holeBox{left:calc(env(safe-area-inset-left,0px) + var(--sal) + 88px);right:calc(env(safe-area-inset-right,0px) + var(--sar) + 112px);padding:6px 9px}
}

/* ---------- MediaCube revision v1.4 ----------
   Two rules keep every screen safe at every size:
   (a) the fixed corner buttons own a reserved band that overlay content never enters;
   (b) nothing has a hard pixel floor — grids and rows shrink instead of escaping their card. */
:root{--corner:58px;--band:calc(env(safe-area-inset-top,0px) + var(--sat) + var(--corner) + 20px)}

/* (a) reserved band + overlays that can always be scrolled to their top */
.overlay{padding-top:var(--band)}
#menu,#daily,#results,#settings,#stats,#shop,#courses,#holes,#pause,#oos,#maraEnd,#dailyEnd{justify-content:flex-start}
#menu>:first-child,#daily>:first-child,#results>:first-child,
#settings>:first-child,#stats>:first-child,#shop>:first-child,#courses>:first-child,#holes>:first-child,
#pause>:first-child,#oos>:first-child,#maraEnd>:first-child,#dailyEnd>:first-child{margin-top:auto}
#menu>:last-child,#daily>:last-child,#results>:last-child,
#settings>:last-child,#stats>:last-child,#shop>:last-child,#courses>:last-child,#holes>:last-child,
#pause>:last-child,#oos>:last-child,#maraEnd>:last-child,#dailyEnd>:last-child{margin-bottom:auto}

/* the HUD and the corner buttons are decoration: they never share the screen with a card or a pause */
body.modal #hud,body.paused #hud,body.hostpause #hud{visibility:hidden}
body.modal #topBtns,body.modal #btnGift{visibility:hidden}
body.paused #btnPause{visibility:hidden!important}
body.coaching #hint,body.coaching #kbHint{visibility:hidden}   /* the coach already says it, in the middle of the screen */

/* (b) a pause stops the loop AND every animation; only the simulated-ad card stays usable */
body.hostpause .btn,body.hostpause .ib,body.hostpause .setSeg button,body.hostpause .scard,body.hostpause .tab,body.hostpause .ccard{pointer-events:none!important;opacity:.55}
body.hostpause #adMock .btn{pointer-events:auto!important;opacity:1}
body.paused *,body.hostpause *{animation-play-state:paused!important}
body.hostpause #adMock *{animation-play-state:running!important}

/* (c) grids and rows shrink; the width caps keep the look identical wherever there is room */
#shopGrid{grid-template-columns:repeat(3,minmax(0,1fr));width:min(94vw,382px)}
#courseGrid{grid-template-columns:repeat(2,minmax(0,1fr));width:min(94vw,400px)}
#holeGrid{grid-template-columns:repeat(3,minmax(0,1fr));width:min(94vw,348px)}
#statGrid{grid-template-columns:repeat(2,minmax(0,1fr));width:min(94vw,393px)}
body.landscape #shopGrid{grid-template-columns:repeat(4,minmax(0,1fr));width:min(94vw,510px)}
body.landscape #courseGrid{grid-template-columns:repeat(4,minmax(0,1fr));width:min(94vw,876px)}
body.landscape #holeGrid{grid-template-columns:repeat(5,minmax(0,1fr));width:min(94vw,594px)}
body.landscape #statGrid{grid-template-columns:repeat(4,minmax(0,1fr));width:min(94vw,747px)}
.scard,.stRow,.ccard,.mRow,.setRow,.pill,.tabs,.row,.col,.menuBtns{min-width:0}
.scard>*,.stRow>*,.ccard>*,.mRow>*{min-width:0;max-width:100%}
.scard canvas{max-width:100%}
.sname,.scost,.stRow .k,.stRow .v,.ccard .cname,.ccard .cnum{overflow:hidden;text-overflow:ellipsis}
/* settings rows: the label wraps and shrinks, the segment keeps 44px targets — never pushed out of the card */
.setRow{gap:8px}
.setRow .lbl{min-width:0;flex:1 1 auto;overflow-wrap:anywhere;text-align:left}
.setSeg{min-width:0;flex:0 0 auto}
.setSeg button{min-width:44px;flex:0 1 auto;padding:9px 8px}
#setList,#missionList{width:min(94vw,340px)}
#shopGrid{max-width:100%}

/* row-direction layouts (wide & short, landscape results) keep their own centring */
@media (max-height:560px) and (min-aspect-ratio:7/4){
  #menu,#daily,#results{justify-content:center}
  #menu>:first-child,#menu>:last-child,#daily>:first-child,#daily>:last-child,#results>:first-child,#results>:last-child{margin-top:0;margin-bottom:0}
}
body.landscape #results{justify-content:center}
body.landscape #results>:first-child,body.landscape #results>:last-child{margin-top:0;margin-bottom:0}
/* very short windows: drop the decorative line so the menu still fits without scrolling */
@media (max-height:520px){#menu #menuHint{display:none}#menu{gap:7px}}

@media (max-width:480px){
  #dots{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 104px)}
  #btnUndo,#btnLine{right:calc(env(safe-area-inset-right,0px) + var(--sar) + 12px)}
  #btnLine{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 128px)}
  #btnUndo{top:calc(env(safe-area-inset-top,0px) + var(--sat) + 184px)}
}

</style>
</head>

        const cap=GEOM.sphere(0.16,10,{col:[0.7,0.75,0.85]});b.append(cap);return b.finish();})();
      // translucent jet cone (unit length along +X, scaled per fan)
      this._fanConeGeo=(()=>{const c=GEOM.cyl(0.55,1,1,16,{col:[1,1,1],cap:false});GEOM.rotZ(c,-Math.PI/2);GEOM.translate(c,0.5,0,0);return c;})();
      // magnet pylon
      this._magGeo=(()=>{const p=GEOM.cyl(0.2,0.16,0.9,10,{col:[0.5,0.54,0.62]});GEOM.translate(p,0,0.45,0);
        const head=GEOM.torus(0.34,0.12,14,8,{col:[0.95,0.35,0.4]});GEOM.rotX(head,Math.PI/2);GEOM.translate(head,0,0.98,0);return GEOM.merge([p,head]);})();
      this._magRingGeo=GEOM.torus(1,0.035,24,6,{col:[1,1,1]});
      // cannon: barrel on a swivel base
      this._cannonGeo=(()=>{const base=GEOM.cyl(0.55,0.45,0.34,12,{col:[0.36,0.4,0.48]});GEOM.translate(base,0,0.17,0);
        const barrel=GEOM.cyl(0.34,0.4,1.25,12,{col:[0.72,0.6,0.32],capCol:[0.3,0.26,0.2]});GEOM.rotZ(barrel,-Math.PI/2);GEOM.translate(barrel,0.62,0.5,0);
        const band=GEOM.torus(0.42,0.06,12,6,{col:[0.9,0.78,0.4]});GEOM.rotZ(band,Math.PI/2);GEOM.translate(band,0.95,0.5,0);
        return GEOM.merge([base,barrel,band]);})();
      // breakable crate
      this._breakGeo=GEOM.box(1.05,0.95,1.05,{bevel:0.07,col:[1,1,1]});
      this._millPoleGeo=(()=>{const p=GEOM.cyl(0.12,0.09,1.1,8,{col:[0.8,0.82,0.88]});GEOM.translate(p,0,0.55,0);const roof=GEOM.cone(0.55,0.7,8,{col:[0.85,0.3,0.25]});GEOM.translate(roof,0,1.1,0);const hut=GEOM.cyl(0.42,0.38,0.6,8,{col:[0.93,0.9,0.82]});GEOM.translate(hut,0,0.8,0);return GEOM.merge([p,hut,roof]);})();
    }
    this.bumperInst=H.bumpers.length?new GL.Instanced(this._bumperGeo,H.bumpers.length):null;
    this.coinInst=H.coins.length?new GL.Instanced(this._coinGeo,H.coins.length):null;
    this.portalMesh=H.portals.length?new GL.Mesh(this._portalGeo):null;
    this.millBar=H.windmills.length?new GL.Mesh(this._millBarGeo):null;
    this.millPole=H.windmills.length?new GL.Mesh(this._millPoleGeo):null;
    this.bounceM=H.bouncers.length?new GL.Mesh(this._bounceGeo):null;
    this.spinM=H.spinners.length?new GL.Mesh(this._spinGeo):null;
    this.gateM=H.gates.length?new GL.Mesh(this._gateGeo):null;
    this.fanBase=H.fans.length?new GL.Mesh(this._fanBaseGeo):null;
    this.fanBlade=H.fans.length?new GL.Mesh(this._fanBladeGeo):null;
    this.fanCone=H.fans.length?new GL.Mesh(this._fanConeGeo):null;
    this.magM=H.magnets.length?new GL.Mesh(this._magGeo):null;
    this.magRing=H.magnets.length?new GL.Mesh(this._magRingGeo):null;
    this.cannonM=H.cannons.length?new GL.Mesh(this._cannonGeo):null;
    this.breakM=H.breakables.length?new GL.Mesh(this._breakGeo):null;
    if(H.platforms.length&&!this.platSlab){
      const top=GEOM.box(1,0.16,1,{col:[1,1,1]});GEOM.translate(top,0,-0.08,0);
      this.platSlab=new GL.Mesh(top);
    }
  },
  draw(t,theme){
    const H=this.H;if(!H)return;const shadow=GL.pass==='shadow';
    GL.drawLit(this.green,null,CMAT.grass);
    if(this.sandM)GL.drawLit(this.sandM,null,CMAT.sand);
    GL.drawLit(this.fringeM,null,CMAT.fringe);
    GL.drawLit(this.skirtM,null,CMAT.dirt);
    GL.drawLit(this.wallsM,null,CMAT.wall);
    GL.drawLit(this.cupM,null,CMAT.cup);
    GL.drawLit(this.teeM,null,CMAT.tee);
    if(this.iceM)GL.drawLit(this.iceM,null,CMAT.ice);
    if(this.mudM)GL.drawLit(this.mudM,null,CMAT.mud);
    if(this.beltM){CMAT.belt.uvScroll[1]=(-t*0.55)%1;GL.drawLit(this.beltM,null,CMAT.belt);}
    if(this.padsM){CMAT.pad.uvScroll[1]=(t*1.4)%1;GL.drawLit(this.padsM,null,CMAT.pad);}
    if(this.waterM&&!shadow){CMAT.water.uvScroll[0]=(t*0.05)%1;CMAT.water.uvScroll[1]=(t*0.03)%1;GL.drawLit(this.waterM,null,CMAT.water);}
    // bumpers (with hit squash)
    if(this.bumperInst){
      for(let i=0;i<H.bumpers.length;i++){const b=H.bumpers[i];const k=this.bumperHit[i]>0?1+Math.sin(this.bumperHit[i]*26)*0.12*this.bumperHit[i]:1;
        const o={h:0,gx:0,gz:0};H.hgrad(b.x,b.z,o);
        M4.ident(_m0);M4.translate(_m0,_m0,b.x,o.h,b.z);M4.scale(_m0,_m0,k,2-k>1.2?1.2:2-k,k);
        this.bumperInst.set(i,_m0,1,1,1,1);}
      this.bumperInst.count=H.bumpers.length;this.bumperInst.touch();
      GL.drawLit(this.bumperInst,null,CMAT.bumper);
    }
    // coins
    if(this.coinInst){
      let n=0;
      for(let i=0;i<H.coins.length;i++){const c=H.coins[i];if(c.taken)continue;
        M4.ident(_m0);M4.translate(_m0,_m0,c.x,c.y+Math.sin(t*3+i)*0.07,c.z);M4.rotY(_m0,_m0,t*2.6+i);
        this.coinInst.set(n,_m0,1,1,1,1);n++;}
      this.coinInst.count=n;this.coinInst.touch();
      if(n)GL.drawLit(this.coinInst,null,CMAT.coin);
    }
    // portals
    if(this.portalMesh&&!shadow){
      for(const p of H.portals){
        const o={h:0,gx:0,gz:0};
        for(const end of [[p.ax,p.az,[0.25,0.85,1]],[p.bx,p.bz,[1,0.4,0.9]]]){
          H.hgrad(end[0],end[1],o);
          M4.ident(_m0);M4.translate(_m0,_m0,end[0],o.h+0.75,end[1]);M4.rotY(_m0,_m0,t*0.8);M4.rotX(_m0,_m0,Math.PI/2);
          CMAT.portal.emi=end[2];GL.drawLit(this.portalMesh,_m0,CMAT.portal);
        }
      }
    }
    // windmills
    if(this.millBar){
      for(const w of H.windmills){
        const o={h:0,gx:0,gz:0};H.hgrad(w.x,w.z,o);
        M4.ident(_m0);M4.translate(_m0,_m0,w.x,o.h,w.z);GL.drawLit(this.millPole,_m0,CMAT.mill);
        const a=w.w*t;
        M4.ident(_m0);M4.translate(_m0,_m0,w.x,o.h+0.25,w.z);M4.rotY(_m0,_m0,-Math.atan2(Math.sin(a),Math.cos(a)));M4.scale(_m0,_m0,2*w.len,1,1);
        GL.drawLit(this.millBar,_m0,CMAT.millBar);
      }
    }
    // trampolines (squash + rebound on trigger)
    if(this.bounceM){
      for(let i=0;i<H.bouncers.length;i++){const b=H.bouncers[i];const o={h:0,gx:0,gz:0};H.hgrad(b.x,b.z,o);
        const k=this.bounceHit[i]>0?this.bounceHit[i]:0;
        // power is readable at a glance: a weak pad is short and green, a strong one is tall and hot.
        // the XZ footprint stays true to the collision radius so the visual never lies about reach.
        const pw=clamp((b.p-6)/10,0,1);
        const sy=(0.85+pw*2.6)*(1-Math.sin(k*Math.PI)*0.55),sxz=1+Math.sin(k*Math.PI)*0.16;
        CMAT.bounce.emi=[0.02+pw*0.30,0.30-pw*0.26,0.18-pw*0.16];
        CMAT.bounce.tint=[1+pw*2.2,1-pw*0.55,1-pw*0.75];
        M4.ident(_m0);M4.translate(_m0,_m0,b.x,o.h,b.z);M4.scale(_m0,_m0,sxz,sy,sxz);
        GL.drawLit(this.bounceM,_m0,CMAT.bounce);}
      CMAT.bounce.tint=null;
    }
    // turntables
    if(this.spinM){
      for(const sp of H.spinners){const o={h:0,gx:0,gz:0};H.hgrad(sp.x,sp.z,o);
        M4.ident(_m0);M4.translate(_m0,_m0,sp.x,o.h+0.005,sp.z);M4.rotY(_m0,_m0,sp.w*t);M4.scale(_m0,_m0,sp.r,1,sp.r);
        GL.drawLit(this.spinM,_m0,CMAT.spin);}
    }
    // timed gates: rise out of the ground while closed, drop away while open
    if(this.gateM){
      for(const g2 of H.gates){
        const up=H.gateUp(g2,t);
        if(up<=0.02)continue;
        const mx=(g2.ax+g2.bx)/2,mz=(g2.az+g2.bz)/2,len=Math.hypot(g2.bx-g2.ax,g2.bz-g2.az);
        const o={h:0,gx:0,gz:0};H.hgrad(mx,mz,o);
        M4.ident(_m0);M4.translate(_m0,_m0,mx,o.h-1.34*(1-up),mz);M4.rotY(_m0,_m0,-Math.atan2(g2.bz-g2.az,g2.bx-g2.ax));M4.scale(_m0,_m0,len,1,1);
        GL.drawLit(this.gateM,_m0,CMAT.gate);}
    }
    // air jets
    if(this.fanBase){
      for(const f of H.fans){const o={h:0,gx:0,gz:0};H.hgrad(f.x,f.z,o);
        const yaw=-Math.atan2(f.dz,f.dx);
        M4.ident(_m0);M4.translate(_m0,_m0,f.x,o.h,f.z);M4.rotY(_m0,_m0,yaw);
        GL.drawLit(this.fanBase,_m0,CMAT.fan);
        M4.ident(_m0);M4.translate(_m0,_m0,f.x+f.dx*0.30,o.h+0.82,f.z+f.dz*0.30);M4.rotY(_m0,_m0,yaw);M4.rotX(_m0,_m0,t*17);
        GL.drawLit(this.fanBlade,_m0,CMAT.fanBlade);
        if(!shadow&&this.fanCone){ // breathing jet cone shows reach and direction
          const pulse=0.72+0.28*Math.sin(t*7);
          CMAT.fanCone.alpha=0.13*pulse;
          M4.ident(_m0);M4.translate(_m0,_m0,f.x+f.dx*0.6,o.h+0.82,f.z+f.dz*0.6);M4.rotY(_m0,_m0,yaw);
          M4.scale(_m0,_m0,f.len*0.92,f.w*0.5*pulse,f.w*0.5*pulse);
          GL.drawLit(this.fanCone,_m0,CMAT.fanCone);}
        }
    }
    // magnets: pylon plus pulsing field rings
    if(this.magM){
      for(const m of H.magnets){const o={h:0,gx:0,gz:0};H.hgrad(m.x,m.z,o);
        M4.ident(_m0);M4.translate(_m0,_m0,m.x,o.h,m.z);GL.drawLit(this.magM,_m0,CMAT.mag);
        if(!shadow)for(let k=0;k<3;k++){
          const ph=((t*0.55+k/3)%1);
          const r=m.r*(m.force>0?1-ph:ph)+0.15;
          CMAT.magRing.emi=m.force>0?[0.95,0.35,0.4]:[0.4,0.7,1];
          CMAT.magRing.alpha=0.55*(1-Math.abs(ph-0.5)*1.4);
          M4.ident(_m0);M4.translate(_m0,_m0,m.x,o.h+0.09,m.z);M4.scale(_m0,_m0,r,1,r);
          GL.drawLit(this.magRing,_m0,CMAT.magRing);}
      }
    }
    // cannons
    if(this.cannonM){
      for(const cn of H.cannons){const o={h:0,gx:0,gz:0};H.hgrad(cn.x,cn.z,o);
        M4.ident(_m0);M4.translate(_m0,_m0,cn.x,o.h,cn.z);M4.rotY(_m0,_m0,-Math.atan2(cn.dz,cn.dx));M4.rotZ(_m0,_m0,Math.asin(cn.ev));
        GL.drawLit(this.cannonM,_m0,CMAT.cannon);}
    }
    // breakable crates (chipped crates shrink and darken; shattered ones vanish)
    if(this.breakM){
      for(let i=0;i<H.breakables.length;i++){
        if(H.brk[i]<=0)continue;const bk=H.breakables[i];const o={h:0,gx:0,gz:0};H.hgrad(bk.x,bk.z,o);
        const dmg=1-H.brk[i]/Math.max(1,bk.hits);
        const hit=this.breakHit[i]>0?this.breakHit[i]:0;
        // toughness reads BEFORE the first hit: a one-hit pane is small, pale and glassy,
        // a three-hit block is oversized and iron-dark. Damage then shrinks and dims it.
        const tough=clamp((bk.hits-1)/2,0,1);

        GL.drawLit(this.platSlab,_m0,CMAT.plat);
      }
    }
  },
  update(dt){
    if(this.bumperHit)for(let i=0;i<this.bumperHit.length;i++)if(this.bumperHit[i]>0)this.bumperHit[i]-=dt;
    if(this.bounceHit)for(let i=0;i<this.bounceHit.length;i++)if(this.bounceHit[i]>0)this.bounceHit[i]-=dt*2.6;
    if(this.breakHit)for(let i=0;i<this.breakHit.length;i++)if(this.breakHit[i]>0)this.breakHit[i]-=dt*3.2;
  },

  hitBounce(i){if(this.bounceHit&&i<this.bounceHit.length)this.bounceHit[i]=1;},
  hitBreak(i){if(this.breakHit&&i<this.breakHit.length)this.breakHit[i]=1;},
};

/* ---------- CAM: golf cameras — flyover / aim / follow / sink ---------- */
const CAM={
  pos:new Float32Array([0,8,-8]),look:new Float32Array([0,0,8]),up:new Float32Array([0,1,0]),right:new Float32Array([1,0,0]),
  view:M4.create(),proj:M4.create(),vp:M4.create(),eye:new Float32Array(3),fov:60,timeScale:1,trauma:0,
  mode:'aim',_t:0,_flyT:0,_fov:60,_init:false,aimDir:null,userYaw:0,
  _p:new Float32Array(3),_l:new Float32Array(3),_tmp:new Float32Array(3),
  reset(){this._init=false;this.trauma=0;this.timeScale=1;},
  addTrauma(x){this.trauma=Math.min(1,this.trauma+x);},
  setMode(m){if(this.mode!==m){this.mode=m;if(m==='flyover')this._flyT=0;}},
  /* B ball state, H hole, aspect; aimDir {x,z} unit from ball toward target while aiming */
  update(dt,B,H,aspect){
    this._t+=dt;
    const port=clamp((1/aspect-0.56)/(1.78-0.56),0,1);
    let fov=lerp(52,64,port);
    const dist=lerp(8.2,7.2,port),height=lerp(5.5,6.4,port);
    // camera sits behind the ball facing the planned line (bot-suggested); falls back to the cup direction
    let dx,dz;
    if(this.aimDir&&(this.mode==='aim'||this.mode==='flyover')){dx=-this.aimDir.x;dz=-this.aimDir.z;}
    else{
      dx=B.x-H.cup.x;dz=B.z-H.cup.z;let dl=Math.hypot(dx,dz);
      if(dl<2){dx=(H.tee.x-H.cup.x);dz=(H.tee.z-H.cup.z);dl=Math.hypot(dx,dz)||1;}
      dx/=dl;dz/=dl;
    }
    if(this.userYaw&&this.mode==='aim'){const cy=Math.cos(this.userYaw),sy=Math.sin(this.userYaw);const nx=dx*cy-dz*sy,nz=dx*sy+dz*cy;dx=nx;dz=nz;}
    if(this.mode==='flyover'){
      this._flyT+=dt;const k=smooth(this._flyT/2.3);
      const fx=lerp(H.cup.x,B.x+dx*dist,k),fz=lerp(H.cup.z,B.z+dz*dist,k);
      const fy=lerp(H.cupY+9,H.cupY+height,k);
      V3.set(this._p,fx,fy,fz);
      V3.set(this._l,lerp(H.cup.x,B.x,k*0.7),lerp(H.cupY+0.5,B.y+0.4,k),lerp(H.cup.z,B.z,k*0.7));
      fov=lerp(fov+8,fov,k);
      V3.copy(this.pos,this._p);V3.copy(this.look,this._l);this._init=true;
    } else if(this.mode==='sink'){
      const r=4.2,a=this._t*0.5;
      V3.set(this._p,H.cup.x+Math.cos(a)*r,H.cupY+3.4,H.cup.z+Math.sin(a)*r);
      V3.set(this._l,H.cup.x,H.cupY+0.3,H.cup.z);
      this.pos[0]=damp(this.pos[0],this._p[0],4,dt);this.pos[1]=damp(this.pos[1],this._p[1],4,dt);this.pos[2]=damp(this.pos[2],this._p[2],4,dt);
      this.look[0]=damp(this.look[0],this._l[0],8,dt);this.look[1]=damp(this.look[1],this._l[1],8,dt);this.look[2]=damp(this.look[2],this._l[2],8,dt);
    } else { // aim / follow
      V3.set(this._p,B.x+dx*dist,Math.max(B.y,0)+height,B.z+dz*dist);
      V3.set(this._l,B.x-dx*2.5,B.y+0.3+port*1.15,B.z-dz*2.5);
      if(!this._init){V3.copy(this.pos,this._p);V3.copy(this.look,this._l);this._init=true;}
      const lp=this.mode==='follow'?3.2:5.5;
      this.pos[0]=damp(this.pos[0],this._p[0],lp,dt);this.pos[1]=damp(this.pos[1],this._p[1],lp*0.9,dt);this.pos[2]=damp(this.pos[2],this._p[2],lp,dt);
      this.look[0]=damp(this.look[0],this._l[0],9,dt);this.look[1]=damp(this.look[1],this._l[1],7,dt);this.look[2]=damp(this.look[2],this._l[2],9,dt);
    }
    // shake
    this.trauma=Math.max(0,this.trauma-dt*1.8);
    const sh=this.trauma*this.trauma,ts=this._t*35;
    const shX=sh*0.4*(Math.sin(ts*1.3)+Math.sin(ts*2.7+1.7)*0.5),shY=sh*0.3*Math.sin(ts*1.9+0.8);

    M4.mul(this.vp,this.proj,this.view);
    V3.set(this.eye,px,py,pz);
  },
};

/* ---------- BOT (pure): samples candidate shots through the real simulator ----------
   Used by: unit tests (solvability guarantee), attract mode, autotest, covers. Deterministic. */
const BOT={
  DIRS:17,SPREAD:Math.PI*0.75,POWERS:[0.22,0.36,0.5,0.66,0.82,1.0],
  plan(H,x,z,t0){
    const toCup=Math.atan2(H.cup.z-z,H.cup.x-x);
    let best=null;
    for(let di=0;di<this.DIRS;di++){
      const a=toCup+(di-(this.DIRS-1)/2)/((this.DIRS-1)/2)*this.SPREAD;
      const dx=Math.cos(a),dz=Math.sin(a);
      for(const pw of this.POWERS){
        const speed=lerp(BALLPHYS.CONST.MIN_SHOT+0.5,BALLPHYS.CONST.MAX_SHOT,pw);
        const r=BALLPHYS.simShot(H,x,z,dx,dz,speed,t0,null,0,H.hasSlow?8:5);
        let score;
        if(r.sunk)score=1000-speed*2;                          // prefer calm sinks
        else if(r.voided||r.water)score=-900;
        else{score=-Math.hypot(r.x-H.cup.x,r.z-H.cup.z);if(!H.onGreen(r.x,r.z))score-=50;}
        if(!best||score>best.score)best={score,dx,dz,speed,sunk:!!r.sunk};
      }
    }
    return best;
  },
  /* plays a full hole; returns strokes used (penalties included) or -1 if not sunk within maxStrokes */
  solve(H,maxStrokes,t0){
    const B=BALLPHYS.create();BALLPHYS.place(B,H.tee.x,H.tee.z,H);
    H.resetDynamic();
    let t=t0||0,strokes=0;
    while(strokes<maxStrokes){
      const p=this.plan(H,B.x,B.z,t);
      if(!p)return -1;
      strokes++;
      BALLPHYS.shoot(B,p.dx,p.dz,p.speed);
      let el=0;
      while(el<10&&!B.rest&&!B.sunk){BALLPHYS.step(B,H,1/240,t);t+=1/240;el+=1/240;}
      B.events.length=0;
      if(B.sunk)return strokes;
      if(B.needRespawn){B.needRespawn=false;BALLPHYS.respawn(B,H);strokes++;} // +1 penalty
      t+=0.5; // thinking time keeps moving parts honest
    }
    return -1;
  },
};

  /* ---------- marathon: procedural, bot-verified ---------- */
  marathonHole(idx,seed){
    const rng=mulberry32((seed*131+idx*977+7)>>>0);
    const r=(a,b)=>Math.round((a+rng()*(b-a))*2)/2;
    const diff=Math.min(1,idx/14);
    const kinds=['straight','dogleg','mound','sand','bumpers'];
    if(idx>=2)kinds.push('gap','windmill');
    if(idx>=5)kinds.push('platform','water','pads');
    for(let attempt=0;attempt<8;attempt++){
      const kind=kinds[(rng()*kinds.length)|0];
      let def=null;
      const len=r(11,14+diff*6),w=r(2.5,4);
      if(kind==='straight')def={par:2,tee:[0,1.5],cup:[0,len-1.5],rects:[[-w,0,w,len]],tilts:rng()<0.5?[[-w,3,w,len,r(-1,1),0.3,r(0.5,0.9)]]:[],coins:[[0,len/2]]};
      else if(kind==='mound')def={par:2,tee:[0,1.5],cup:[0,len-1.5],rects:[[-w,0,w,len]],mounds:[[r(-1.5,1.5),r(5,len-4),r(1.8,2.6),r(0.6,1.0)]],coins:[[0,len/2]]};
      else if(kind==='dogleg'){const side=rng()<0.5?-1:1,arm=r(4.5,6.5);def={par:3,tee:[0,1.5],cup:[side*(arm+1),len-3.5],rects:[[-2.5,0,2.5,len],[Math.min(-2.5,side*(arm+3)),len-6,Math.max(2.5,side*(arm+3)),len-1]],coins:[[0,len-4]]};}
      else if(kind==='sand')def={par:3,tee:[0,1.5],cup:[0,len-1.5],rects:[[-w-1,0,w+1,len]],sand:[[-w+0.5,len*0.4,w-0.5,len*0.6]],coins:[[w,len/2]]};
      else if(kind==='bumpers')def={par:3,tee:[0,1.5],cup:[0,len-1.5],rects:[[-w,0,w,len]],bumpers:[[r(-1.5,1.5),r(5,7)],[r(-1.5,1.5),r(8,len-4)]],coins:[[0,len*0.6]]};

// ===== 51-prog.js =====
/* ---------- PROG: levels, ranks, mastery and the reward track ----------
   One closed-form curve. The level is DERIVED from total XP, never stored, so it can never
   desync from the save and a future retune re-derives everyone's level with no migration. */
const PROG={
  MAXLV:50,
  need(L){return 20*(L+1);},                                   // XP to advance FROM level L
  xpAtLevel(L){return 10*(L-1)*(L+2);},                        // cumulative XP to BE level L
  levelOf(xp){return clamp(Math.floor((Math.sqrt(9+0.4*Math.max(0,xp))-1)/2),1,this.MAXLV);},
  /* progress inside the current level → {lv, into, need, frac} */
  levelInfo(xp){
    const lv=this.levelOf(xp);
    if(lv>=this.MAXLV)return{lv,into:0,need:0,frac:1,max:true};
    const base=this.xpAtLevel(lv),nxt=this.xpAtLevel(lv+1);
    return{lv,into:xp-base,need:nxt-base,frac:clamp((xp-base)/Math.max(1,nxt-base),0,1),max:false};
  },
  /* ---------- XP sources ---------- */
  XP:{HOLE:10,STAR:[0,0,8,20],UNDER:6,ACE:15,PICKUP:2,FIRST:25,BEST:12,REPLAY_CAP:32,
      COURSE:60,COURSE_REPLAY:40,COURSE_UNDER:3,COURSE_UNDER_CAP:60,
      MARA_HOLE:8,MARA_BEST:50,DAILY_FIRST:100,MISSION:60,MISSION_SET:150},
  /* XP for one completed hole. `prev` is the star count before this attempt (0 = never cleared). */
  holeXP(o){
    const X=this.XP;
    if(o.skipped)return X.HOLE;
    let xp=X.HOLE+X.STAR[o.stars]+X.PICKUP*(o.pickups||0);
    if(o.strokes<o.par)xp+=X.UNDER*(o.par-o.strokes);
    if(o.strokes===1)xp+=X.ACE;
    const first=!o.prev;
    if(first)xp+=X.FIRST;
    else if(o.newBest)xp+=X.BEST;
    if(o.prev===3)xp=Math.min(xp,X.REPLAY_CAP);   // farming a solved hole pays what it pays
    return xp;
  },
  courseXP(o){
    const X=this.XP;
    let xp=o.firstClear?X.COURSE:X.COURSE_REPLAY;
    if(o.parTotal>o.total)xp+=Math.min(X.COURSE_UNDER_CAP,X.COURSE_UNDER*(o.parTotal-o.total));
    return xp;
  },
  masteryXP(c){return 120+15*c;},
  masteryCoins(c){return 250+50*c;},
  /* ---------- level reward track ---------- */
  coinGrant(L){return [40,80,130,190,260][Math.min(4,Math.floor((L-1)/10))];},
  /* extras beyond the flat coin grant; `t` = title, `u` = unlocked feature, `b/tr/au/ai/fl` = cosmetics */
  TRACK:{2:{u:'daily'},3:{t:'ROOKIE PRO'},4:{u:'stats'},5:{u:'marathon'},6:{c:150},8:{t:'BANKER'},
    10:{u:'filters'},12:{u:'timeattack'},14:{t:'CLOCKSMITH'},16:{c:200},18:{c:250},20:{ai:'pixel'},
    22:{c:250},24:{t:'GLACIER'},26:{c:350},28:{t:'METRONOME'},30:{c:350},32:{tr:6},34:{t:'STORMWRIGHT'},
    36:{c:450},38:{t:'VOIDWALKER'},40:{au:'solar'},42:{c:450},44:{t:'ORRERY'},46:{t:'SKYWRIGHT'},
    48:{c:600},50:{b:12,fl:'crown',t:'SKY MASTER'}},
  /* ---------- rank tiers (total stars) ---------- */
  RANKS:[
    {key:'rank_rookie',stars:0,coins:0},
    {key:'rank_amateur',stars:25,coins:200},
    {key:'rank_clubhouse',stars:60,coins:300,b:9},
    {key:'rank_pro',stars:105,coins:400},
    {key:'rank_tourpro',stars:155,coins:500,b:11},
    {key:'rank_acehunter',stars:210,coins:600,tr:5},
    {key:'rank_skycaptain',stars:265,coins:700,b:13},
    {key:'rank_legend',stars:320,coins:800,tr:7},
    {key:'rank_celestial',stars:378,coins:1000,fl:'aurora',t:'PERFECTIONIST'},
  ],
  rankOf(stars){let r=0;for(let i=0;i<this.RANKS.length;i++)if(stars>=this.RANKS[i].stars)r=i;return r;},
  nextRank(stars){const r=this.rankOf(stars);return r+1<this.RANKS.length?this.RANKS[r+1]:null;},
  /* ---------- the single "what should I do next" answer ---------- */
  nextGoal(st){
    const li=this.levelInfo(st.xp||0);
    const cands=[];
    if(!li.max)cands.push({kind:'level',n:li.lv+1,left:li.need-li.into,unit:'xp'});
    const nr=this.nextRank(st.stars);
    if(nr)cands.push({kind:'rank',key:nr.key,left:nr.stars-st.stars,unit:'star'});
    // the nearest course you could master
    let bestM=null;
    for(let c=0;c<st.courseStars.length;c++){
      if(st.courseStars[c]>=27||c>st.unlocked)continue;
      const left=27-st.courseStars[c];
      if(st.courseStars[c]>0&&(!bestM||left<bestM.left))bestM={kind:'mastery',n:c,left,unit:'star'};
    }
    if(bestM)cands.push(bestM);
    if(!cands.length)return null;
    // "closest" = fewest units remaining, with stars weighted (a star is worth ~55 xp of effort)
    cands.sort((a,b)=>(a.unit==='star'?a.left*55:a.left)-(b.unit==='star'?b.left*55:b.left));
    return cands[0];
  },
};

/* ---------- LO: the daily layer — calendar, streak, daily challenge, missions ----------
   Everything here pays out from ABSOLUTE local thresholds, so nothing needs connectivity and
   nothing silently fails when the platform has no leaderboard. This is the only file allowed
   to read the wall clock. */
const LO={
  /* ---- time ---- */
  now(){return Date.now();},
  dayIndex(ms){const d=new Date(ms);return Math.floor((ms-d.getTimezoneOffset()*6e4)/864e5);},
  weekIndex(day){return Math.floor((day+3)/7);},   // day -3 == Mon 1969-12-29, so weeks start Monday
  today(){return this.dayIndex(this.now());},

  /* ---- rollover ------------------------------------------------------------
     Guards, in order: a baked window (a clock set to 2099 cannot mint rewards),
     a ratchet (time never runs backwards), and a real-time gap (you cannot farm
     days by toggling the clock inside one session). */
  MAXDAYS:730,
  resolveDay(S){
    const tm=S.tm||(S.tm={d:0,mx:0,st:0,bs:0,sv:0,n:0,w:0,cl:0,pd:0});
    const raw=this.dayIndex(this.now());
    const base=tm.d||raw;
    let d=clamp(raw,base-this.MAXDAYS,base+this.MAXDAYS);
    if(!tm.d){tm.d=d;tm.mx=d;tm.st=1;tm.n=1;tm.w=this.weekIndex(d);return{first:true,rolled:true,gap:0};}
    if(d<tm.mx){tm.cl++;d=tm.mx;}                                   // ratchet
    const gap=d-tm.d;
    if(gap<=0)return{rolled:false,gap:0};
    const pn=(typeof performance!=='undefined'&&performance.now)?performance.now():0;
    if(this._lastRoll!==undefined&&pn-this._lastRoll<20*60*1000)return{rolled:false,gap:0};
    let saver=false,broken=false,prevSt=0;
    if(gap===1)tm.st++;
    else if(gap===2&&tm.sv>0){tm.sv--;tm.st++;saver=true;}
    else{broken=true;prevSt=tm.st;tm.st=Math.max(3,1);}             // forgiveness: never back to day 1 (a rewarded ad may restore it)
    tm.d=d;tm.mx=Math.max(tm.mx,d);tm.n++;this._lastRoll=pn;
    if(tm.st>tm.bs)tm.bs=tm.st;
    const weekRolled=this.weekIndex(d)>tm.w;
    if(weekRolled)tm.w=this.weekIndex(d);
    return{rolled:true,gap,saver,weekRolled,broken,prevSt};
  },

  /* ---- play streak ---- */
  LADDER:[25,40,60,80,110,150,250],
  LADDER_XP:[30,40,60,80,110,150,300],
  streakMult(st){return 1+0.25*Math.min(4,Math.floor((st-1)/7));},
  streakDay(st){return ((st-1)%7+7)%7;},
  streakReward(st){
    const i=this.streakDay(st),m=this.streakMult(st);
    return{coins:Math.round(this.LADDER[i]*m/5)*5,xp:Math.round(this.LADDER_XP[i]*m),day:i+1,big:i===6};
  },
  MILESTONES:{3:{coins:100},7:{tr:1},14:{b:2},30:{b:14},60:{au:'holo'},100:{t:'EVERGREEN'}},

  /* ---- daily challenge: three holes, the same three for everyone, every day ---- */
  DAY_SHAPE:[1,0,0,1,1,2,2],   // Sun..Sat → tier per weekday (Mon/Tue easy, Fri/Sat hard)
  hash32(n){n=(n^0x5A17)>>>0;n=Math.imul(n^n>>>15,0x2C1B3C6D)>>>0;n=Math.imul(n^n>>>12,0x297A2D39)>>>0;return (n^n>>>15)>>>0;},
  dailyDefs(day){
    if(typeof DAILY_POOL==='undefined')return null;
    const wd=((day+4)%7+7)%7;                       // day 0 == Thursday 1970-01-01
    const baseTier=this.DAY_SHAPE[wd];
    const out=[];
    for(let k=0;k<3;k++){
      const tier=Math.min(2,baseTier+(k===2?1:0));  // the third hole is always the sting
      const list=DAILY_POOL.tiers[tier]||DAILY_POOL.tiers[0];
      if(!list||!list.length)return null;
      out.push(list[this.hash32(day*3+k)%list.length]);
    }
    return out;
  },
  dailyPar(day){const d=this.dailyDefs(day);return d?d.reduce((a,b)=>a+b.par,0):0;},
  score(o){
    return clamp(3000+120*Math.max(0,o.parTotal-o.strokes)-80*Math.max(0,o.strokes-o.parTotal)
      +25*(o.coins||0)+(o.firstTry?150:0),0,6000)|0;
  },
  medal(strokes,parTotal,finished){
    if(!finished)return 0;
    if(strokes<=parTotal-2)return 4;
    if(strokes<=parTotal)return 3;
    if(strokes<=parTotal+3)return 2;
    return 1;
  },
  MEDAL_PAY:[{c:0,x:0},{c:30,x:40},{c:50,x:80},{c:80,x:130},{c:120,x:200}],
  MEDAL_KEY:['','md_finish','md_bronze','md_silver','md_gold'],

  /* ---- missions ------------------------------------------------------------
     One funnel: LO.bump(counter, n) walks the active missions. Every counter below
     already exists in GAME.stat, so nothing needs bespoke bookkeeping. */
  OBJ:[
    {id:'shots',   c:'strokes',      g:'volume',slot:'A',lo:25,hi:40},
    {id:'holes',   c:'holesSunk',    g:'volume',slot:'A',lo:6, hi:10},
    {id:'coins',   c:'coinPickups',  g:'coin',slot:'A',lo:8, hi:14},
    {id:'walls',   c:'wallHits',     g:'volume',slot:'A',lo:20,hi:35},
    {id:'parb',    c:'parOrBetter',  g:'skill',slot:'B',lo:3, hi:5},
    {id:'birdie',  c:'birdiePlus',   g:'skill',slot:'B',lo:2, hi:3},
    {id:'star3',   c:'stars3',       g:'skill',slot:'B',lo:3, hi:5},
    {id:'clean',   c:'cleanHole',    g:'skill',slot:'B',lo:5, hi:8},
    {id:'bank',    c:'bankSinks',    g:'skill',slot:'B',lo:2, hi:3},
    {id:'allco',   c:'allCoinHole',  g:'coin',slot:'B',lo:3, hi:5},
    {id:'bump',    c:'bumperHits',   g:'mech',slot:'C',lo:8, hi:15,gate:1},
    {id:'pad',     c:'padUses',      g:'mech',slot:'C',lo:5, hi:9, gate:3},
    {id:'portal',  c:'portalUses',   g:'mech',slot:'C',lo:4, hi:8, gate:3},
    {id:'air',     c:'bigAir',       g:'mech',slot:'C',lo:4, hi:7, gate:2},
    {id:'ice',     c:'iceRide',      g:'mech',slot:'C',lo:4, hi:8, gate:6},
    {id:'belt',    c:'beltRide',     g:'mech',slot:'C',lo:4, hi:8, gate:6},
    {id:'spin',    c:'spinRide',     g:'mech',slot:'C',lo:3, hi:6, gate:8},
    {id:'gate',    c:'gateHits',     g:'mech',slot:'C',lo:3, hi:6, gate:5},
    {id:'cannon',  c:'cannonRides',  g:'mech',slot:'C',lo:3, hi:6, gate:9},
    {id:'tramp',   c:'bounces',      g:'mech',slot:'C',lo:4, hi:8, gate:9},
    {id:'break',   c:'smashes',      g:'mech',slot:'C',lo:3, hi:6, gate:5},
    {id:'course',  c:'coursesDone',  g:'meta',slot:'D',lo:1, hi:1},
    {id:'mara',    c:'marathonHoles',g:'meta',slot:'D',lo:6, hi:10,needMara:true},
    {id:'daily',   c:'dailyDone',    g:'meta',slot:'D',lo:1, hi:1},
    {id:'equip',   c:'equipChange',  g:'meta',slot:'D',lo:1, hi:1},
  ],
  eligible(o,st){
    if(o.gate!==undefined&&st.unlocked<o.gate)return false;
    if(o.needMara&&!st.maraUnlocked)return false;
    return true;
  },
  /* deterministic per player-day, one per slot so a day is never three impossible tasks */
  rollDaily(day,st,avoid){
    const rng=mulberry32((day^0x5A17)>>>0);
    // three missions should be three different things to do. two objectives that watch the same
    // counter ("collect 12 coins" + "collect every coin on 3 holes") read as one task twice, so
    // a counter already drawn is excluded — and only re-allowed if the slot would otherwise be empty.
    const usedC={},usedId={},usedG={};
    const pickSlot=(slots)=>{
      const ok=o=>slots.indexOf(o.slot)>=0&&this.eligible(o,st)&&!usedId[o.id]&&(!avoid||avoid.indexOf(o.id)<0);
      let pool=this.OBJ.filter(o=>ok(o)&&!usedC[o.c]&&!usedG[o.g]);
      if(!pool.length)pool=this.OBJ.filter(o=>ok(o)&&!usedC[o.c]);
      if(!pool.length)pool=this.OBJ.filter(ok);
      if(!pool.length)return null;
      const o=pool[(rng()*pool.length)|0];
      const n=o.lo+Math.floor(rng()*(o.hi-o.lo+1));
      usedC[o.c]=1;usedId[o.id]=1;usedG[o.g]=1;
      return{id:o.id,c:o.c,n,p:0};
    };
    const out=[];
    for(const slots of [['A'],['B','C'],['D']]){const m=pickSlot(slots);if(m)out.push(m);}
    while(out.length<3){const m=pickSlot(['A','B','C','D']);if(!m)break;out.push(m);}
    return out;
  },
  MISSION_PAY:{coins:40,xp:60},
  MISSION_SET:{coins:80,xp:150},
  /* increment every active mission watching this counter; returns the ids that just completed */
  bump(S,counter,n){
    const ms=S.ms;if(!ms||!ms.list)return null;
    let done=null;
    for(const m of ms.list){
      if(m.c!==counter||m.p>=m.n)continue;
      m.p=Math.min(m.n,m.p+(n===undefined?1:n));
      if(m.p>=m.n&&!m.paid){(done||(done=[])).push(m);}
    }
    return done;
  },
  allDone(S){const ms=S.ms;return !!(ms&&ms.list&&ms.list.length&&ms.list.every(m=>m.p>=m.n));},
};

/* ---------- AUD: procedural Web Audio — golf SFX + mellow generative music (original, no samples) ---------- */
const AUD={
  ctx:null,userMuted:false,hostMuted:false,paused:false,voices:0,musicOn:true,palette:'day',_step:0,_next:0,_timer:0,_duck:1,
  get muted(){return this.userMuted||this.hostMuted||this.paused;},
  ensure(){
    if(this.ctx){if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});return;}
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
    let c;try{c=this.ctx=new C();}catch(e){return;}
    this.master=c.createGain();this.master.gain.value=this.muted?0:1;
    this.comp=c.createDynamicsCompressor();this.comp.threshold.value=-14;this.comp.knee.value=20;this.comp.ratio.value=6;this.comp.attack.value=0.004;this.comp.release.value=0.18;
    this.master.connect(this.comp);this.comp.connect(c.destination);
    this.sfx=c.createGain();this.sfx.gain.value=0.9;this.sfx.connect(this.master);
    this._loadSamples();
    this.music=c.createGain();this.music.gain.value=0.26;
    this.mLP=c.createBiquadFilter();this.mLP.type='lowpass';this.mLP.frequency.value=2800;this.mLP.Q.value=0.6;
    this.music.connect(this.mLP);this.mLP.connect(this.master);
    this.dly=c.createDelay(0.9);this.dly.delayTime.value=60/96*0.75;this.fb=c.createGain();this.fb.gain.value=0.3;this.wet=c.createGain();this.wet.gain.value=0.24;
    this.music.connect(this.dly);this.dly.connect(this.fb);this.fb.connect(this.dly);this.dly.connect(this.wet);this.wet.connect(this.mLP);
    const len=c.sampleRate*1.5|0,buf=c.createBuffer(1,len,c.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;this.nbuf=buf;
    // rolling loop: noise → LP → gain (driven by ball speed)
    this.rSrc=c.createBufferSource();this.rSrc.buffer=buf;this.rSrc.loop=true;
    this.rF=c.createBiquadFilter();this.rF.type='lowpass';this.rF.frequency.value=400;
    this.rG=c.createGain();this.rG.gain.value=0;
    this.rSrc.connect(this.rF);this.rF.connect(this.rG);this.rG.connect(this.sfx);this.rSrc.start();
    // storm wind bed
    this.wSrc=c.createBufferSource();this.wSrc.buffer=buf;this.wSrc.loop=true;
    this.wF=c.createBiquadFilter();this.wF.type='bandpass';this.wF.frequency.value=420;this.wF.Q.value=0.5;
    this.wG=c.createGain();this.wG.gain.value=0;
    this.wSrc.connect(this.wF);this.wF.connect(this.wG);this.wG.connect(this.sfx);this.wSrc.start();
    this._step=0;this._next=c.currentTime+0.1;
    this._timer=setInterval(()=>this._tick(),60);
  },
  _applyMaster(){if(!this.ctx)return;const t=this.ctx.currentTime;this.master.gain.cancelScheduledValues(t);this.master.gain.setTargetAtTime(this.muted?0:1,t,0.03);},
  setUserMute(b){this.userMuted=!!b;this._applyMaster();},
  setHostMute(b){this.hostMuted=!!b;this._applyMaster();},
  setPaused(b){this.paused=!!b;this._applyMaster();if(this.ctx&&!b&&this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});},
  tone(o){
    if(!this.ctx||this.voices>24)return;const c=this.ctx,t=o.at||c.currentTime;this.voices++;setTimeout(()=>this.voices--,(o.dur+0.1)*1000);
    const os=c.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(o.f0,t);
    if(o.f1)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.f1),t+o.dur);
    const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.vol,t+(o.att||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    let node=os;if(o.lp){const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=o.lp;node.connect(f);node=f;}
    node.connect(g);g.connect(o.bus||this.sfx);os.start(t);os.stop(t+o.dur+0.05);
  },
  noise(o){
    if(!this.ctx||this.voices>24)return;const c=this.ctx,t=o.at||c.currentTime;this.voices++;setTimeout(()=>this.voices--,(o.dur+0.1)*1000);
    const s=c.createBufferSource();s.buffer=this.nbuf;s.loop=true;s.playbackRate.value=o.rate||1;
    const f=c.createBiquadFilter();f.type=o.ft||'lowpass';f.Q.value=o.q||0.8;f.frequency.setValueAtTime(o.f0,t);if(o.f1)f.frequency.exponentialRampToValueAtTime(Math.max(30,o.f1),t+o.dur);
    const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.vol,t+(o.att||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+o.dur);
    s.connect(f);f.connect(g);g.connect(o.bus||this.sfx);s.start(t);s.stop(t+o.dur+0.05);
  },
  /* ---- continuous (call every frame) ---- */
  roll(v01,sand,storm){
    if(!this.ctx)return;const t=this.ctx.currentTime;
    this.rG.gain.setTargetAtTime(v01>0.02?0.028+0.075*v01*(sand?1.6:1):0,t,0.07);
    this.rF.frequency.setTargetAtTime(sand?260:340+v01*520,t,0.1);
    this.wG.gain.setTargetAtTime(storm?0.05:0,t,0.4);
  },
  /* ---- sample bank (CC0 recordings, decoded lazily; synth stays as instant fallback) ---- */
  buf:{},_b64:null,FILES:["sfx-1.json","sfx-2.json"],   // the build rewrites FILES with the packed sfx-N.json list
  /* the bank is fetched (relative paths) only after gameReady, so the first frame never waits on it; each file that
     arrives is decoded as soon as an AudioContext exists, and until then every sample falls back to synth */
  fetchSamples(){
    if(this._fetched||typeof fetch!=='function')return;this._fetched=true;this._fetchAt=(typeof performance!=='undefined'&&performance.now)?performance.now():0;

  _rarity(it){if(it.rank!==undefined||it.lv!==undefined||it.streak!==undefined)return 'r4';
    if(!it.cost)return '';return it.cost<=600?'r1':it.cost<=1300?'r2':it.cost<=2000?'r3':'r4';},
  _gateLabel(it,st){
    if(it.rank!==undefined)return{ok:st.rank>=it.rank,txt:T(PROG.RANKS[it.rank].key)};
    if(it.lv!==undefined)return{ok:st.lv>=it.lv,txt:T('lv_n',{n:it.lv})};
    if(it.streak!==undefined)return{ok:(st.streak||0)>=it.streak,txt:T('streak_n',{n:it.streak})};
    return null;},
  shop(st,h,popId){
    const e=this.el;e.shopCoinNum.textContent=fmtInt(st.coins);
    this.shopTabSet(this._shopTab);
    e.shopTitle.textContent=T(this._shopTab);
    const grid=e.shopGrid;grid.innerHTML='';this._trailCvs=[];
    const tab=this._shopTab;
    const items=tab==='balls'?HOLES.BALLS:tab==='trails'?HOLES.TRAILS:tab==='auras'?HOLES.AURAS:HOLES.FLAGS;
    const ownList=tab==='balls'?st.balls:tab==='trails'?st.trails:tab==='auras'?st.auras:st.flags;
    const cur=tab==='balls'?st.ball:tab==='trails'?st.trail:tab==='auras'?st.aura:st.flag;
    const seen=st.seenShop||[];
    items.forEach(it=>{
      const tag=tab.charAt(0)+it.id;
      const owned=ownList.indexOf(it.id)>=0, sel=cur===it.id;
      const gate=this._gateLabel(it,st), gated=!!gate, gateOk=!!(gate&&gate.ok);
      const card=document.createElement('div');
      card.className='scard '+this._rarity(it)+(sel?' sel':'')+(owned?'':' locked')+(popId===tag?' pop':'');
      const cv=document.createElement('canvas');cv.width=cv.height=112;
      if(tab==='balls')this._ballIcon(cv,it.skin,owned);
      else if(tab==='trails'){this._trailIcon(cv,it.fx,owned,0.35);}   // a still frame: the moving preview read as a 'spinning ball' after a purchase
      else if(tab==='auras')this._auraIcon(cv,it.id,owned);
      else this._flagIcon(cv,it.id,owned);
      card.appendChild(cv);
      const nm=document.createElement('div');nm.className='sname';
      nm.textContent=(tab==='balls'?it.skin:tab==='trails'?it.fx:it.id);card.appendChild(nm);
      const cost=document.createElement('div');cost.className='scost';
      if(owned)cost.textContent=sel?T('equipped'):T('equip');
      else if(gated){if(gateOk){cost.classList.add('canUnlock');cost.textContent=T('unlock');}
        else{cost.classList.add('starReq');cost.textContent=gate.txt;}}
      else cost.innerHTML='<span class="coinIc"></span>'+fmtInt(it.cost);
      card.appendChild(cost);
      if(sel){const tg=document.createElement('div');tg.className='stag';tg.textContent='✓';card.appendChild(tg);}
      if(!owned&&seen.indexOf(tag)<0&&(gated?gateOk:st.coins>=it.cost)){

      on(card,'click',ev=>{ev.stopPropagation();

    });

  /* a drawn padlock reads identically on every platform, unlike an emoji */
  _lock(g,w){

    const cx=w/2,cy=w/2+5,bw=28,bh=21;
    g.strokeStyle='rgba(255,255,255,.94)';g.lineWidth=5;
    g.beginPath();g.arc(cx,cy-bh*0.6,9.5,Math.PI,0);g.stroke();
    g.fillStyle='rgba(255,255,255,.94)';g.fillRect(cx-bw/2,cy-bh/2,bw,bh);
    g.fillStyle='rgba(20,26,40,.9)';g.beginPath();g.arc(cx,cy,3.4,0,TAU);g.fill();},
  _ballIcon(cv,skin,owned){
