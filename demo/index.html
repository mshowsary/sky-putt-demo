/* ---------- GAME: state machine, drag-aim input, hole/course/marathon flow, PG wiring ---------- */
const SMOKE={on:false,log(m){if(this.on)console.log('[SMOKE] '+m);},fail(m){console.log('[SMOKE] FAIL '+m);}};
window.addEventListener('error',e=>{SMOKE.fail('onerror '+(e.message||e)+' @'+(e.lineno||'?'));});
window.addEventListener('unhandledrejection',e=>{SMOKE.fail('unhandledrejection '+(e.reason&&e.reason.message||e.reason));});
/* ---- trajectory preview (honest: real simulator) ---- */
const AIM={inst:null,pts:new Float32Array(3*34),n:0,sunk:false,
  init(){this.inst=new GL.Instanced(GEOM.sphere(0.12,10,{col:[1,1,1]}),34);},
  clear(){this.n=0;},
  compute(H,B,dx,dz,speed,t){const mt=3.2+(H.hasSlow?1.4:0);
    const r=BALLPHYS.simShot(H,B.x,B.z,dx,dz,speed,t,this.pts,34,mt);this.n=r.pts;this.sunk=!!r.sunk;},
  draw(){
    if(!this.n)return;const I=this.inst;
    for(let i=0;i<this.n;i++){const k=1-i/this.n;const s=0.5+0.55*k;
      const r=this.sunk?0.45:1,g=this.sunk?1:1,b=this.sunk?0.55:1;
      I.setTRS(i,this.pts[i*3],this.pts[i*3+1]+0.05,this.pts[i*3+2],0,0,0,s,r,g,b,0.25+0.6*k);}
    I.count=this.n;I.touch();
    GL.drawLit(I,null,MAT_AIM);
  },
};
const MAT_AIM={unlit:true,blend:true,cast:false,depthWrite:false,alpha:0.9};
const GAME={
  state:'boot',S:null,H:null,B:null,
  AD_FIRST_HOLE:6,AD_HOLE_GAP:3,GIFT_COINS:150,GIFT_PER_DAY:3,
  course:0,hole:0,strokes:0,limit:6,holeCoins:0,runCoins:0,scoreStrokes:[],scorePars:[],earned:0,
  marathon:false,maraIdx:0,maraSeed:1,maraExtraUsed:false,
  t:0,slice:0,bot:false,botT:0,attract:false,_bannerT:0,_sunkT:0,_wallB:0,_trailAcc:0,_lastFly:0,_dc:0,
  drag:null,_aimAcc:0,_out:{on:false,h:0,gx:0,gz:0,sand:false,water:false,pvx:0,pvz:0,ice:false,mud:false,bax:0,baz:0,svx:0,svz:0,spin:false},
  boot(){
    const Qs=qs();SMOKE.on=Qs.has('autotest')||Qs.has('gltest');
    // the static HTML already shows #loading; two frames later it is really on screen → firstFrameReady
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      PG.firstFrame();
      this._bootSteps([
        ()=>{if(!GL.init($('c'))){UI.init();UI.applyLang();UI.show('nogl');UI.loading(false);PG.gameReady();SMOKE.fail('no webgl2');return false;}},
        ()=>{const t0=performance.now();TEX.build();this.texMs=performance.now()-t0;},
        ()=>{CMAT.bind();FX.init();AIM.init();UI.init();},
        ()=>this._bootMain(Qs),
      ]);
    }));
  },
  // each heavy step runs in its own macrotask so the loading screen keeps animating and input stays responsive
  _bootSteps(steps){const run=i=>{if(i>=steps.length)return;let r;try{r=steps[i]();}catch(e){SMOKE.fail('boot step '+i+' '+(e&&e.message));throw e;}if(r===false)return;setTimeout(()=>run(i+1),0);};run(0);},
  _bootMain(Qs){
    this.slice=parseFloat(Qs.get('slice'))||0;
    if(Qs.get('ads')==='1')PG._adMockForce=true;
    this.bot=Qs.get('bot')==='1';
    PG.init(()=>{
      I18N.setLang(Qs.get('lang')||PG.lang);UI.applyLang();UI.layout();
      this.S=this._loadSave();
      PG.setScore(this.stats().stars);      // queued by the layer until gameReady; keeps YouTube's best equal to the save
      AUD.setUserMute(!!this.S.muted);
      if(this.S.music===0)AUD.musicOn=false;
      if(this.S.q!==undefined)GL.setQuality(['low','medium','high'][this.S.q]||'high');
      PG.onPause(v=>this._hostPause(v));
      PG.onAudio(v=>AUD.setHostMute(!v));if(!PG.audioEnabled)AUD.setHostMute(true);
      const h=this._handlers();this._h=h;UI.bind(h);
      this._bindInput();this._bindKeys();
      const gt=Qs.get('gltest');
      if(gt){this._glTest(+(Qs.get('c')||0),+(Qs.get('h')||0),+(Qs.get('theme')||-1),Qs.get('ball')||'classic');return;}
      if(Qs.get('marathon')==='1'){this.maraStart();}
      else if(Qs.has('c')){this.startCourse(+(Qs.get('c')||0),+(Qs.get('h')||0));}
      else this.toMenu(true);
      this.stat('sessions');
      this._resolveDay();
      if(this.state==='menu')UI.menu(this.stats());   // the day rolled after the menu rendered (streak offer, gift count)
      this.save();
      this._loopOn=true;this._raf=requestAnimationFrame(ts=>this._frame(ts));
      // gameReady only once a real frame of the interactable screen has been rendered
      requestAnimationFrame(()=>requestAnimationFrame(()=>{UI.loading(false);PG.gameReady();this.bootMs=performance.now();AUD.fetchSamples();
        SMOKE.log('boot ok state='+this.state+' lang='+I18N.lang+' ready='+this.bootMs.toFixed(0)+'ms tex='+(this.texMs|0)+'ms');}));
    });
  },
  /* ---------- save ---------- */
  _loadSave(){
    const d=PG.load();
    const S={v:3,coins:0,unlocked:0,hs:{},balls:[0],trails:[0],ball:0,trail:0,maraBest:0,muted:false,
      seen:{},seenShop:[],bestT:{},run:null,stat:{},
      xp:0,titles:[],unlocks:{},rank:0,mast:[],auras:['none'],aura:'none',flags:['classic'],flag:'classic',aims:['dots'],aim:'dots',
      tm:null,ms:null,dc:null,wk:null,hb:{}};
    // keep keys this build does not know about: an older cached build must never eat a newer save
    if(d&&typeof d==='object')for(const k in d)if(d[k]!==undefined)S[k]=d[k];
    const arr=(v,f)=>Array.isArray(v)&&v.length?v:f;
    const num=(v,f)=>typeof v==='number'&&isFinite(v)?v:f;
    const obj=(v)=>(v&&typeof v==='object'&&!Array.isArray(v))?v:{};
    S.balls=arr(S.balls,[0]);S.trails=arr(S.trails,[0]);S.titles=Array.isArray(S.titles)?S.titles:[];
    S.auras=arr(S.auras,['none']);S.flags=arr(S.flags,['classic']);S.aims=arr(S.aims,['dots']);
    // whatever is equipped must also be owned. a save that lost its owned-list (or an id that no
    // longer exists in the catalogue) would otherwise render the equipped cosmetic as locked.
    const equip=(list,cur,cat,key,dflt)=>{
      const has=v=>cat.some(it=>it.id===v);
      let c=has(S[cur])?S[cur]:dflt;
      if(!has(c))c=dflt;
      S[cur]=c;
      S[list]=S[list].filter(has);
      if(S[list].indexOf(dflt)<0)S[list].unshift(dflt);
      if(S[list].indexOf(c)<0)S[list].push(c);
    };
    equip('balls','ball',HOLES.BALLS,'ball',0);
    equip('trails','trail',HOLES.TRAILS,'trail',0);
    equip('auras','aura',HOLES.AURAS,'aura','none');
    equip('flags','flag',HOLES.FLAGS,'flag','classic');
    S.hs=obj(S.hs);S.stat=obj(S.stat);S.seen=obj(S.seen);S.bestT=obj(S.bestT);S.unlocks=obj(S.unlocks);
    S.mast=Array.isArray(S.mast)?S.mast:[];
    S.coins=num(S.coins,0);S.xp=num(S.xp,0);S.unlocked=num(S.unlocked,0);S.maraBest=num(S.maraBest,0);S.rank=num(S.rank,0);
    // v2 -> v3: the old index-5 finale was promoted to index 13 when eight worlds were inserted
    if(num(S.v,2)<3){
      const hs={};for(const k in S.hs){const p=k.split(':');hs[(p[0]==='5'?'13':p[0])+':'+p[1]]=S.hs[k];}
      S.hs=hs;
      if(S.bestT&&S.bestT['5']!==undefined){S.bestT['13']=S.bestT['5'];delete S.bestT['5'];}
      S.unlocked=Math.min(S.unlocked,5);
      if(S.run&&S.run.c===5)S.run=null;
      S.v=3;
    }
    return S;
  },
  save(){PG.save(this.S);},
  /* ---------- career counters (missions, achievements and the stats screen read these) ---------- */
  stat(k,n){const S=this.S;if(!S)return;if(!S.stat)S.stat={};const v=(n===undefined?1:n);S.stat[k]=(S.stat[k]||0)+v;
    const done=LO.bump(S,k,v);if(done)this._missionsDone(done);},
  _missionsDone(list){
    for(const m of list){
      if(m.paid)continue;m.paid=1;
      this.S.coins+=LO.MISSION_PAY.coins;this.addXP(LO.MISSION_PAY.xp);
      UI.toast(T('mission_done',{m:T('obj_'+m.id,{n:m.n})}));
    }
    if(LO.allDone(this.S)&&!this.S.ms.setPaid){
      this.S.ms.setPaid=1;this.S.coins+=LO.MISSION_SET.coins;this.addXP(LO.MISSION_SET.xp);
      UI.toast(T('mission_all'));AUD.unlock();
    }
    UI.setCoins(this.S.coins,true);this.save();
  },
  statMax(k,v){const S=this.S;if(!S)return;if(!S.stat)S.stat={};if(v>(S.stat[k]||0))S.stat[k]=v;},
  statGet(k){return (this.S&&this.S.stat&&this.S.stat[k])||0;},
  stats(){
    const n=HOLES.courseCount(),cs=new Array(n).fill(0);let tot=0;
    for(const k in this.S.hs){const c=+k.split(':')[0];if(c>=0&&c<n){cs[c]+=this.S.hs[k];tot+=this.S.hs[k];}}
    const li=PROG.levelInfo(this.S.xp||0);
    return{stars:tot,maxStars:n*27,courseStars:cs,unlocked:this.S.unlocked,

  _bindInput(){

         &&Math.hypot(this.B.x-this.H.cup.x,this.B.z-this.H.cup.z)>=BALLPHYS.CONST.FUNNEL_R){

  /* host pause (YouTube onPause / an ad): save first, silence, stop the loop. The PAUSED card stays

      if(!PG.adBusy&&(this.state==='aim'||this.state==='drag'||this.state==='rolling'||this.state==='flyover'||this.state==='sunk'))this.openPause();
      this._hostPaused=true;this._syncPauseClasses();   // a game-requested ad is not a host pause the player must sit out

  /* ---------- trail cosmetics ---------- */

      const p=[B.x+rand(-0.05,0.05),B.y+0.15,B.z+rand(-0.05,0.05)];

      else if(fx==='flame')FX.flameBits(p,1,[1,0.6,0.15],[-B.vx/sp,0,-B.vz/sp]);

      else if(fx==='halo')FX.ring([B.x,B.y+0.1,B.z],[1,0.92,0.6],1.1,0.28);

          if(p){BALLPHYS.shoot(B,p.dx,p.dz,p.speed);if(!this.attract){this.strokes++;UI.setStrokes(this.strokes,this.limit);this.state='rolling';CAM.setMode('follow');}}
          this.botT=this.attract?1.6:0.8;}

          this._rollT=0;BALLPHYS.respawn(B,this.H);this.state='aim';CAM.setMode('aim');this._planAim();UI.toast(T('ball_returned'));return;}

      const sp=Math.hypot(B.vx,B.vz);

      AUD.roll(B.grounded&&!B.sunk?clamp(sp/11,0,1):0,!!this._out.sand,!!(WORLD.cur&&WORLD.cur.rain));
      if(H.belts.length||H.spinners.length)AUD.beltHum(!!(this._out.bax||this._out.baz||this._out.spin));

  /* an equipped aura is a couple of additive sprites riding the ball — no new material */
  _auraDraw(){

    else if(a==='ring'){for(let k=0;k<2;k++){const ph=(t*0.9+k*0.5)%1;P.add(B.x,y,B.z,0.9+ph*2.2,0.45,0.9,1,0.34*(1-ph),0,1);}}
    else if(a==='spark'){for(let k=0;k<5;k++){const an=t*2.4+k*1.257;P.add(B.x+Math.cos(an)*0.62,y+Math.sin(t*3+k)*0.16,B.z+Math.sin(an)*0.62,0.3,1,0.85,0.35,0.85,0,1);}}
    else if(a==='solar'){P.add(B.x,y,B.z,2.0+0.2*Math.sin(t*5),1,0.62,0.18,0.34,0,1);
      for(let k=0;k<6;k++){const an=t*1.6+k*1.047;P.add(B.x+Math.cos(an)*0.85,y,B.z+Math.sin(an)*0.85,0.34,1,0.8,0.3,0.7,0,1);}}
    else if(a==='holo'){for(let k=0;k<3;k++){const c=[[1,0.35,0.7],[0.35,0.95,1],[0.75,1,0.5]][k];
      P.add(B.x+Math.cos(t*2+k*2.1)*0.4,y,B.z+Math.sin(t*2+k*2.1)*0.4,1.1,c[0],c[1],c[2],0.28,0,1);}}
    GL.drawParticles(P,TEX.glow,true);
  },
  /* ---------- render-only test mode (gltest=1, used by render smokes) ---------- */
  _glTest(c,h,themeOverride,ballStyle){
    const H=HOLES.compile(c,h);
    if(themeOverride>=0)H.theme=themeOverride;
    this.attract=true;this.S.ball=0;
    this._buildHole(H,H.theme);
    if(ballStyle&&ballStyle!=='classic')BALLM.build(ballStyle);
    this.state='aim';this.botT=0.6;this.attract=true;
    UI.hideAll();UI.loading(false);PG.gameReady();AUD.fetchSamples();
    this._loopOn=true;this._raf=requestAnimationFrame(ts=>this._frame(ts));
    let n=0;const logT=setInterval(()=>{n++;SMOKE.log('hole c'+c+'h'+h+' err='+GL.err()+' draws='+GL.stats.draws+' tris='+(GL.stats.tris|0)+' ball='+this.B.x.toFixed(1)+','+this.B.z.toFixed(1));if(n>40)clearInterval(logT);},2000);
  },
};
window.GAME=GAME;
GAME.boot();

</script>
